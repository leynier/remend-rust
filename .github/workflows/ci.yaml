name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Build documentation
        run: cargo doc --no-deps

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate LCOV report
        run: |
          mkdir -p target/llvm-cov
          cargo llvm-cov --all-features --workspace --lcov --output-path target/llvm-cov/lcov.info
          cargo llvm-cov report --json --summary-only --output-path target/llvm-cov/coverage.json

      - name: Show coverage summary
        run: |
          jq -r '.data[0].totals | "Lines: \(.lines.covered)/\(.lines.count) (\(.lines.percent * 100 | round / 100)%)\nFunctions: \(.functions.covered)/\(.functions.count) (\(.functions.percent * 100 | round / 100)%)\nRegions: \(.regions.covered)/\(.regions.count) (\(.regions.percent * 100 | round / 100)%)"' target/llvm-cov/coverage.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/llvm-cov/lcov.info
          if-no-files-found: error
